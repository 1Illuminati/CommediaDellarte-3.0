<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <div class="header-left">
        <span class="logo">⛏</span>
        <span class="title">Server Dashboard</span>
        <nav class="tab-nav">
            <button class="tab-nav-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">대시보드</button>
            <button class="tab-nav-btn" data-tab="storage" onclick="switchTab('storage')">스토리지</button>
        </nav>
    </div>
    <div class="header-right">
        <span id="uptime-label">—</span>
        <span id="version-label"></span>
        <button class="btn btn-muted" id="logout-btn" onclick="doLogout()">로그아웃</button>
        <button class="btn btn-warn" onclick="serverAction('restart')">재시작</button>
        <button class="btn btn-danger" onclick="serverAction('shutdown')">종료</button>
    </div>
</header>

<!-- ── 대시보드 탭 ── -->
<div id="tab-dashboard" class="tab-panel">
<div class="layout">

    <div class="col-left">

        <section class="card">
            <h2>성능</h2>
            <div class="stat-grid">
                <div class="stat">
                    <div class="stat-label">TPS <span class="sub">10s</span></div>
                    <div class="stat-value" id="v-tps">—</div>
                </div>
                <div class="stat">
                    <div class="stat-label">TPS <span class="sub">5m</span></div>
                    <div class="stat-value" id="v-tps5m">—</div>
                </div>
                <div class="stat">
                    <div class="stat-label">MSPT <span class="sub">mean</span></div>
                    <div class="stat-value" id="v-mspt">—</div>
                </div>
                <div class="stat">
                    <div class="stat-label">MSPT <span class="sub">95%</span></div>
                    <div class="stat-value" id="v-mspt95">—</div>
                </div>
                <div class="stat">
                    <div class="stat-label">CPU <span class="sub">프로세스</span></div>
                    <div class="stat-value" id="v-cpu">—</div>
                </div>
                <div class="stat">
                    <div class="stat-label">CPU <span class="sub">시스템</span></div>
                    <div class="stat-value" id="v-cpusys">—</div>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>메모리</h2>
            <div class="mem-bar-wrap">
                <div class="mem-bar"><div class="mem-fill" id="mem-fill"></div></div>
                <span id="mem-label">— / — MB</span>
            </div>
        </section>

        <section class="card">
            <h2>GC</h2>
            <div id="gc-list"><p class="empty">spark 미설치</p></div>
        </section>

        <section class="card">
            <h2>플레이어 <span id="player-count" class="badge">0</span></h2>
            <div id="player-list"><p class="empty">접속자 없음</p></div>
        </section>

        <section class="card">
            <h2>플러그인 <span id="plugin-count" class="badge">0</span></h2>
            <div id="plugin-list"><p class="empty">로딩 중...</p></div>
        </section>

    </div>

    <div class="col-right">

        <section class="card">
            <h2>파일 매니저</h2>
            <div id="breadcrumb" class="breadcrumb"></div>
            <div id="file-list"><p class="empty">로딩 중...</p></div>
        </section>

        <section class="card console-card">
            <div class="console-title-row">
                <h2>콘솔</h2>
                <button class="btn btn-muted" id="console-pause-btn" onclick="toggleConsolePause()">일시정지</button>
            </div>
            <div id="console-output"></div>
            <div class="console-input-row">
                <input type="text" id="cmd-input" placeholder="명령어 입력..."
                       onkeydown="if(event.key==='Enter') sendCommand()">
                <button class="btn btn-primary" onclick="sendCommand()">실행</button>
            </div>
        </section>

    </div>
</div>
</div>

<!-- ── 스토리지 탭 ── -->
<div id="tab-storage" class="tab-panel" style="display:none">
<div class="storage-layout">

    <div class="storage-toolbar">
        <span class="storage-toolbar-title">로드된 스토리지 <span id="storage-loaded-count" class="badge">0</span></span>
        <button class="btn btn-primary" onclick="openStorageLoadModal()">+ 스토리지 로드</button>
    </div>

    <div id="storage-tree">
        <p class="empty">좌측 버튼으로 스토리지를 로드하세요</p>
    </div>

</div>
</div>

<!-- ── 플레이어 정보 모달 ── -->
<div id="info-modal" class="modal-overlay" style="display:none"
     onclick="if(event.target===this) closeInfoModal()">
    <div class="modal">
        <div class="modal-header">
            <h3 id="info-modal-title">플레이어 정보</h3>
            <button class="modal-close" onclick="closeInfoModal()">✕</button>
        </div>
        <div id="info-modal-body" class="modal-body"></div>
    </div>
</div>

<!-- ── 추방 / 밴 확인 모달 ── -->
<div id="action-modal" class="modal-overlay" style="display:none"
     onclick="if(event.target===this) closeActionModal()">
    <div class="modal">
        <div class="modal-header">
            <h3 id="action-modal-title">추방</h3>
            <button class="modal-close" onclick="closeActionModal()">✕</button>
        </div>
        <div class="modal-body">
            <label class="modal-label">사유 (비워두면 기본 메시지 사용)</label>
            <input type="text" id="action-reason" class="modal-input" placeholder="사유 입력...">
        </div>
        <div class="modal-footer">
            <button class="btn btn-muted" onclick="closeActionModal()">취소</button>
            <button class="btn btn-danger" onclick="confirmPlayerAction()">확인</button>
        </div>
    </div>
</div>

<!-- ── 스토리지 로드 모달 ── -->
<div id="storage-load-modal" class="modal-overlay" style="display:none"
     onclick="if(event.target===this) closeStorageLoadModal()">
    <div class="modal">
        <div class="modal-header">
            <h3>스토리지 로드</h3>
            <button class="modal-close" onclick="closeStorageLoadModal()">✕</button>
        </div>
        <div class="modal-body">
            <label class="modal-label">네임스페이스 (플러그인명)</label>
            <input type="text" id="sl-namespace" class="modal-input" placeholder="예: myplugin"
                   onkeydown="if(event.key==='Enter') document.getElementById('sl-name').focus()">
            <label class="modal-label" style="margin-top:.7rem">타입 (스토리지명)</label>
            <input type="text" id="sl-name" class="modal-input" placeholder="예: player"
                   onkeydown="if(event.key==='Enter') doStorageLoad()">
            <div id="sl-error" class="sl-error" style="display:none"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-muted" onclick="closeStorageLoadModal()">취소</button>
            <button class="btn btn-primary" id="sl-btn" onclick="doStorageLoad()">로드</button>
        </div>
    </div>
</div>

<!-- ── 로그인 오버레이 ── -->
<div id="login-overlay" style="display:none">
    <div class="login-card">
        <div class="login-logo">⛏</div>
        <div class="login-title">Server Dashboard</div>
        <div class="login-sub">관리자 로그인</div>
        <div id="login-error" class="login-error" style="display:none"></div>
        <input type="text"     id="login-user" class="modal-input" placeholder="아이디"
               autocomplete="username"
               onkeydown="if(event.key==='Enter') document.getElementById('login-pass').focus()">
        <input type="password" id="login-pass" class="modal-input" placeholder="비밀번호"
               autocomplete="current-password"
               onkeydown="if(event.key==='Enter') doLogin()">
        <button class="btn btn-primary" id="login-btn" onclick="doLogin()">로그인</button>
    </div>
</div>

<!-- ── 토스트 ── -->
<div id="toast" class="toast" style="display:none"></div>

<script src="/js/main.js"></script>
</body>
</html>
